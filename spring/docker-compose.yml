services:
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      WEATHER_API_KEY: ${WEATHER_API_KEY}
      FASTAPI_API_KEY: ${FASTAPI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/weather_app
      SPRING_DATASOURCE_USERNAME: weather_user
      SPRING_DATASOURCE_PASSWORD: weather_password

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    container_name: weather-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: weather_app
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: weather_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: weather-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: weather-adminer
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: