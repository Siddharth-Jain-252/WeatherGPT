spring.application.name=weathergpt
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/weather_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:weather_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:weather_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
weather.api.key=${WEATHER_API_KEY}
jwt.secret=${JWT_SECRET}
fastapi.base-url=${FASTAPI_BASE_URL:http://localhost:8000}
fastapi.api-key=${FASTAPI_API_KEY}
